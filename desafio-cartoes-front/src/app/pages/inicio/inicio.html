<h1 class="h3">Olá, {{ auth.sessao()?.nome }}!</h1>
<p class="text-body-secondary mb-4">Veja um resumo do sistema de cartões de ônibus.</p>

@if (erro()) {
  <div class="alert alert-danger" role="alert">{{ erro() }}</div>
}

@if (carregando()) {
  <div class="text-center py-5"><div class="spinner-border text-primary" role="status"></div></div>
} @else {
  <div class="row g-3">
    @for (item of indicadores(); track item.rotulo) {
      <div class="col-6 col-lg-3">
        <a [routerLink]="item.link" class="card shadow-sm text-decoration-none h-100">
          <div class="card-body d-flex align-items-center gap-3">
            <i class="bi fs-1 text-primary" [class]="item.icone"></i>
            <div>
              <div class="fs-3 fw-semibold text-body">{{ item.valor }}</div>
              <div class="small text-body-secondary">{{ item.rotulo }}</div>
            </div>
          </div>
        </a>
      </div>
    }
  </div>
}
