<div class="toast-container position-fixed top-0 end-0 p-3" aria-live="polite">
  @for (toast of toasts.toasts(); track toast.id) {
    <div class="toast show align-items-center border-0" [class]="'text-bg-' + toast.tipo" role="status">
      <div class="d-flex">
        <div class="toast-body">{{ toast.mensagem }}</div>
        <button
          type="button"
          class="btn-close btn-close-white me-2 m-auto"
          aria-label="Fechar"
          (click)="toasts.remover(toast.id)"
        ></button>
      </div>
    </div>
  }
</div>
