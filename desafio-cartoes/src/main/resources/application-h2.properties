# Perfil para execução local sem PostgreSQL: banco H2 em memória (os dados somem ao parar a API).
# Uso: ./mvnw spring-boot:run "-Dspring-boot.run.profiles=h2"
spring.datasource.url=jdbc:h2:mem:desafio_cartoes;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=segredo-apenas-para-desenvolvimento-local-h2
app.jwt.validade=2h

app.admin.email=admin@desafio.com
app.admin.senha=admin123
